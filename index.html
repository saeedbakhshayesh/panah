<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010479">
<title>منوی آشپزخانه‌ی پناه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#010479;--navy2:#2b3190;--cream:#F6F0E4;--paper:#FFFDF8;--ink:#14143a;--line:rgba(0,0,102,.28);--gold:#a8884a}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Vazirmatn",Tahoma,sans-serif;background:var(--cream);color:var(--ink);line-height:1.9;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27120%27 height=%2780%27%3E%3Ctext x=%2730%27 y=%2730%27 font-size=%2717%27 font-family=%27Tahoma%2CArial%2Cserif%27 fill=%27%23010479%27 text-anchor=%27middle%27%3E%D9%BE%D9%86%D8%A7%D9%87%3C/text%3E%3Ctext x=%2790%27 y=%2770%27 font-size=%2717%27 font-family=%27Tahoma%2CArial%2Cserif%27 fill=%27%23010479%27 text-anchor=%27middle%27%3E%D9%BE%D9%86%D8%A7%D9%87%3C/text%3E%3C/svg%3E")}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.title{font-family:"Lalezar","Vazirmatn",Tahoma,sans-serif}

/* hero */
.hero{background:var(--navy);color:#fff;text-align:center;padding:24px 16px 72px;border-bottom:4px double var(--gold)}
.seal{display:block;width:min(220px,58vw);margin:0 auto 6px}
.seal img{display:block;width:100%;height:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.slogan{font-family:"Lalezar","Vazirmatn",Tahoma,sans-serif;font-size:1.35rem;opacity:.96}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;animation:splashOut .8s 3.9s forwards;cursor:pointer}
#splash.out{animation:splashOut .5s forwards}
.sl{position:relative;width:min(290px,70vw)}
.sl img{display:block;width:100%;height:auto;animation:rise 1.2s .9s cubic-bezier(.2,.7,.2,1) both}
.draw{position:absolute;left:-5%;top:-5%;width:110%;height:110%;overflow:visible}
.draw ellipse{fill:none;stroke:#fff;stroke-width:1.8;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.8s cubic-bezier(.4,0,.2,1) forwards}
.draw ellipse+ellipse{stroke-width:.9;opacity:.75;animation-delay:.3s}
@keyframes dr{to{stroke-dashoffset:0}}
#splash p{font-family:"Lalezar","Vazirmatn",Tahoma,sans-serif;font-size:1.35rem;margin-top:18px;animation:fade 1s 1.9s both}
#splash .skip{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));font-size:.8rem;opacity:.55;animation:fade 1s 2.6s both}
@keyframes rise{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}

/* info card */
.info{position:relative;z-index:2;width:calc(100% - 28px);max-width:560px;margin:-50px auto 0;background:var(--paper);border:1.5px solid var(--navy);box-shadow:0 0 0 4px var(--paper),0 0 0 5.5px var(--navy);border-radius:18px;padding:16px 18px 18px}
.st{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--navy);margin-bottom:10px}
.st i{width:10px;height:10px;border-radius:50%;background:#b3402f;flex:none}
.st.on i{background:#2e8b57;box-shadow:0 0 0 4px rgba(46,139,87,.2)}
.ad{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:var(--navy);stroke-width:1.8;margin-top:5px}
.hr{list-style:none;padding:0;margin:0 0 14px;font-size:.92rem}
.hr li{display:flex;justify-content:space-between;padding:5px 0;border-top:1px dashed var(--line)}
.hr li.today{color:var(--navy);font-weight:700}
.hr li.today span::after{content:" (امروز)"}
.btns{display:flex;gap:10px}
.btn{flex:1;text-align:center;text-decoration:none;padding:10px;border:1.5px solid var(--navy);border-radius:12px;color:var(--navy);font-weight:500}
.btn.p{background:var(--navy);color:#fff}

/* picks */
#picks{margin:2px 8px 16px}
#picks h2{font-size:1.4rem;color:var(--navy);margin-bottom:4px}
.row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.sg{flex:none;scroll-snap-align:start;min-width:140px;text-align:start;font:inherit;background:var(--paper);border:1.5px solid var(--navy);border-radius:14px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.sg b{font-weight:700}.sg em{font-style:normal;color:var(--navy);font-weight:700}
.sg .bd{align-self:flex-start;margin:0 0 4px}
.it.flash{animation:fl 1.8s}
@keyframes fl{0%,55%{background:rgba(168,136,74,.3)}100%{background:transparent}}
.gz.col .gz-grid{max-height:300px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.more{display:block;margin:4px auto 0;font:inherit;padding:6px 22px;border:1.5px solid var(--navy);border-radius:999px;background:transparent;color:var(--navy);cursor:pointer}
.sb{position:relative}
#qx{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:var(--cream);color:var(--navy);font-size:1.25rem;cursor:pointer;line-height:1}
#q::-webkit-search-cancel-button{display:none}
/* gazette */
.gz{max-width:980px;margin:0 auto;padding:30px 16px 8px}
.gz-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.gz-head::before,.gz-head::after{content:"";flex:1;border-top:3px double var(--navy);opacity:.5}
.gz-head h2{font-family:"Lalezar","Vazirmatn",Tahoma,sans-serif;font-size:1.7rem;color:var(--navy)}
.gz-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:0}
.gz-grid>div{padding:0 20px}
.gz-grid>div+div{border-inline-start:1px solid var(--line)}
.gz-grid>div:first-child{padding-inline-start:0}
.gz-grid>div:last-child{padding-inline-end:0}
.gz h3{font-family:"Lalezar","Vazirmatn",Tahoma,sans-serif;color:var(--navy);font-size:1.25rem;line-height:1.7;margin-bottom:4px}
.gz p{font-size:.95rem;text-align:start}
.gz article{padding:14px 0}
.gz article+article{border-top:1px dashed var(--line)}
.gz .verse{font-family:"Amiri",serif;font-size:1.15rem;white-space:pre-line;text-align:center;line-height:2.1}
.gz .by{font-size:.8rem;opacity:.7;text-align:center}
.gz .kicker{font-family:"Lalezar","Vazirmatn",Tahoma,sans-serif;font-size:1.05rem;color:var(--gold);text-align:center;border-bottom:1px solid var(--line);margin-bottom:6px}

/* sticky tools */
.tools{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:1px solid var(--line);padding:10px 12px 8px;margin-top:26px}
.tools-in{max-width:760px;margin:0 auto}
#q{width:100%;font:inherit;padding:11px 18px;padding-inline-end:44px;border:1.5px solid var(--navy);border-radius:999px;background:var(--paper);color:var(--ink);-webkit-appearance:none;appearance:none}
#chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.95rem;padding:6px 16px;border:1px solid var(--navy);border-radius:999px;background:transparent;color:var(--navy);cursor:pointer}
.chip.on{color:#fff}

/* menu */
main{max-width:760px;margin:22px auto 0;padding:0 14px}
.note{text-align:center;font-size:.85rem;opacity:.75;margin-bottom:12px}
.sheet{background:var(--paper);border:1.5px solid var(--navy);box-shadow:0 0 0 5px var(--paper),0 0 0 6.5px var(--navy);border-radius:18px;padding:8px 22px 22px;margin:8px 8px 0}
.cat{scroll-margin-top:120px;padding-top:18px}
.cat h2{display:flex;align-items:center;gap:12px;font-family:"Lalezar","Vazirmatn",Tahoma,sans-serif;font-size:1.5rem;color:var(--navy);margin-bottom:6px}
.cat h2::before,.cat h2::after{content:"";flex:1;border-top:1px solid var(--line)}
.cat ul{list-style:none;padding:0}
.it{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-radius:6px}
.it .nm{font-weight:500}
.it .dots{flex:1;border-bottom:2px dotted rgba(0,0,102,.35);transform:translateY(-4px);min-width:16px}
.it .pr{font-weight:700;color:var(--navy);font-size:1.12rem}
.it small{display:block;font-size:.78rem;opacity:.7;font-weight:400}
.bd{display:inline-block;font-size:.7rem;font-weight:500;padding:0 8px;margin-inline-start:6px;border-radius:999px;border:1px solid var(--navy);vertical-align:middle;line-height:1.7}
.bd.hot{background:var(--navy);color:#fff}
.bd.new{background:var(--gold);border-color:var(--gold);color:#fff}
#empty{display:none;text-align:center;padding:30px 10px;font-family:"Lalezar","Vazirmatn",Tahoma,sans-serif;font-size:1.2rem;color:var(--navy)}
footer{text-align:center;padding:34px 16px 60px;font-size:.9rem}
footer .title{font-size:1.3rem;color:var(--navy)}
#top{position:fixed;bottom:18px;inset-inline-start:16px;width:42px;height:42px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:1.2rem;cursor:pointer;display:none;z-index:30}

/* visual upgrades */
:root{--noise:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27160%27 height=%27160%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.8%27 numOctaves=%272%27 stitchTiles=%27stitch%27/%3E%3CfeColorMatrix values=%270 0 0 0 .35 0 0 0 0 .28 0 0 0 0 .15 0 0 0 .1 0%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url%28%23n%29%27/%3E%3C/svg%3E")}
body{background-image:var(--noise)}
.sheet{padding:24px 26px 26px;background-color:var(--paper);background-image:var(--noise);box-shadow:0 0 0 5px var(--paper),0 0 0 6.5px var(--navy),0 18px 34px -20px rgba(1,4,121,.4)}
.cat:first-child{padding-top:4px}
.ci{width:28px;height:28px;flex:none;fill:none;stroke:var(--navy);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tea{display:block;width:60px;margin:12px auto 0;overflow:visible}
.gl{fill:rgba(255,255,255,.12);stroke:#fff;stroke-width:1.5;stroke-linejoin:round}
.gl2{fill:none;stroke:#fff;stroke-width:1;opacity:.7}
.sm{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;opacity:0;animation:steam 3.6s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}35%{opacity:.85}100%{opacity:0;transform:translateY(-8px)}}
.hello{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 8px 14px;padding:10px 14px;border:1px dashed var(--navy);border-radius:14px;background:rgba(1,4,121,.05)}
.hello span{font-family:"Lalezar","Vazirmatn",Tahoma,sans-serif;font-size:1.15rem;color:var(--navy);line-height:1.6}
.hello button{flex:none;font:inherit;font-size:.85rem;padding:4px 12px;border:1px solid var(--navy);border-radius:999px;background:var(--navy);color:#fff;cursor:pointer}
#chips{position:relative}
.chip{position:relative;z-index:1}
.pill{position:absolute;left:0;top:0;background:var(--navy);border-radius:999px;transition:transform .38s cubic-bezier(.3,.8,.3,1),width .38s;z-index:0}
#prog{position:fixed;top:0;inset-inline:0;height:3px;z-index:60;background:linear-gradient(90deg,var(--gold),var(--navy));transform:scaleX(0);transform-origin:right}
.rv .it{opacity:0;transform:translateY(10px);transition:opacity .55s,transform .55s}
.rv .it.in{opacity:1;transform:none}
@supports((-webkit-background-clip:text) or (background-clip:text)){
.tt,.gz-head h2,#picks h2{background:linear-gradient(100deg,var(--navy) 38%,#8a6a22 50%,var(--navy) 62%) 100% 0/260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shim 7s linear infinite}}
@keyframes shim{to{background-position:0 0}}
.io .cat:not(.live) .tt,.io #gz:not(.live) .gz-head h2,.io #picks:not(.live) h2,.io .hero:not(.live) .sm{animation-play-state:paused}
@media(max-width:700px){
 .gz-grid{grid-template-columns:1fr}
 .gz-grid>div{padding:0!important;border:0!important}
 .gz-grid>div+div{margin-top:12px;border-top:1px solid var(--line)!important}
 .sheet{padding:20px 20px 22px;margin:8px 2px 0}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.sl img,#splash p,#splash .skip{animation:none}.draw ellipse{animation:none;stroke-dashoffset:0}.sm{animation:none!important;opacity:.5!important}.tt,.gz-head h2,#picks h2{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol></svg>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="ic-breakfast" viewBox="0 0 24 24"><path d="M7 6c3-3 9-2 11 2 3 1 3 6 0 8-2 4-8 4-11 1-4-1-4-8 0-11z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="ic-tea" viewBox="0 0 24 24"><path d="M7 5h10l-1.2 11a3 3 0 0 1-3 2.6h-1.6a3 3 0 0 1-3-2.6z"/><path d="M4 21h16M8.5 10h7"/></symbol><symbol id="ic-hot" viewBox="0 0 24 24"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h2a2.4 2.4 0 0 1 0 4.8h-2M9 3v3M12.5 3v3"/></symbol><symbol id="ic-coffee" viewBox="0 0 24 24"><path d="M6 10h10v3a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4z"/><path d="M16 11h1.5a2 2 0 0 1 0 4H16M4 20.5h14M10 4c-1 1 1 2 0 3.5M13 4c-1 1 1 2 0 3.5"/></symbol><symbol id="ic-meal" viewBox="0 0 24 24"><path d="M5 16a7 7 0 0 1 14 0z"/><path d="M3 19h18M12 6.5V9"/></symbol><symbol id="ic-sides" viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 8c1-2.5 3-2.5 4 0 1-2.5 3-2.5 4 0"/></symbol><symbol id="ic-cold" viewBox="0 0 24 24"><path d="M10 3h4v3l2 3v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9l2-3z"/><path d="M8 13.5h8"/></symbol><symbol id="ic-icedtea" viewBox="0 0 24 24"><path d="M6 8h12l-1.5 12h-9z"/><path d="M13 8l2-4.5h3.5M9.5 12h3v3h-3z"/></symbol></svg>
<div id="prog"></div>
<div id="splash" aria-hidden="true"><div class="sl"><svg class="draw" viewBox="0 0 300 300"><ellipse cx="150" cy="150" rx="129" ry="132" pathLength="1"/><ellipse cx="150" cy="150" rx="122" ry="125" pathLength="1"/></svg><img id="splashLogo" alt=""></div><p id="splashSlogan"></p><span class="skip">برای ورود لمس کنید</span></div>

<header class="hero">
  <div class="seal" id="seal"></div>
  <p class="slogan" id="slogan"></p>
  <svg class="tea" viewBox="0 0 64 70" aria-hidden="true"><path class="sm" d="M25 22c-4-4 4-7 0-12"/><path class="sm" style="animation-delay:1.2s" d="M32 22c-4-4 4-7 0-12"/><path class="sm" style="animation-delay:2.4s" d="M39 22c-4-4 4-7 0-12"/><path class="gl" d="M18 28H46C46 35 41 37 41 42C41 47 46 49 46 54C46 58 43 60 40 60H24C21 60 18 58 18 54C18 49 23 47 23 42C23 37 18 35 18 28Z"/><path class="gl2" d="M20.5 49H43.5M22 53H42"/><ellipse class="gl" cx="32" cy="64" rx="22" ry="4"/></svg>
</header>

<section class="info" id="info" aria-label="اطلاعات کافه"></section>

<section class="gz" id="gz" aria-label="نشریه‌ی ماه"></section>

<div class="tools">
  <div class="tools-in">
    <div class="sb"><input id="q" type="search" placeholder="جستجو در منو..." aria-label="جستجو در منو" autocomplete="off"><button id="qx" aria-label="پاک کردن جستجو" hidden>×</button></div>
    <nav id="chips" aria-label="دسته‌بندی منو"></nav>
  </div>
</div>

<main id="menu">
  <div id="hello" class="hello" hidden></div>
  <section id="picks" aria-label="پیشنهاد پناه"></section>
  <p class="note">قیمت‌ها به هزار تومان است.</p>
  <div class="sheet" id="sheet"></div>
  <p id="empty">چیزی با این نام در منو پیدا نشد. نام دیگری را امتحان کنید.</p>
</main>

<footer id="foot"></footer>
<button id="top" aria-label="بازگشت به بالا">↑</button>

<script>
/* ============================================================
   بخش ویرایش: صاحب کافه فقط همین بخش را تغییر می‌دهد.
   - هر آیتم منو یک خط است: { name: "نام", price: 150 }
   - قیمت‌ها به «هزار تومان» هستند (۱۵۰ یعنی ۱۵۰ هزار تومان).
   - برای اضافه کردن آیتم، یک خط مشابه به انتهای همان دسته اضافه کنید.
   - برای حذف آیتم، خطش را پاک کنید. برای مخفی کردن موقت: available:false
   - price:null یعنی قیمت مشخص نیست و «؟» نمایش داده می‌شود.
   - badge اختیاری است: "پرفروش" ، "محبوب" یا "جدید"
   - note توضیح کوچک زیر نام آیتم است. plus:true یعنی قیمت افزوده (+)
   ============================================================ */
const SETTINGS = {
  name: "آشپزخانه‌ی پناه",
  slogan: "شاید اینجا پناهی برای تو باشَد",
  address: "تبریز، میدان ساعت، کوچه حاج‌هاشم، روبروی ثبت اسناد",
  mapQuery: "آشپزخانه پناه، میدان ساعت، تبریز",  // متن جستجو برای دکمه‌ی مسیریابی
  mapUrl: "",    // اگر لینک دقیق گوگل‌مپ/نشان را دارید اینجا بگذارید (اولویت با این است)
  /* ساعت کاری: days فقط برای نمایش است. on روزهای هفته (Sat شنبه، Sun یکشنبه، Mon دوشنبه، Tue سه‌شنبه، Wed چهارشنبه، Thu پنجشنبه، Fri جمعه) */
  schedule: [
    { days: "شنبه تا پنجشنبه", on: ["Sat","Sun","Mon","Tue","Wed","Thu"], open: "07:30", close: "23:00" },
    { days: "جمعه‌ها", on: ["Fri"], open: "09:00", close: "23:00" }
  ],
  /* پیام خوشامد بر اساس ساعت (به وقت تهران). cat شناسه‌ی دسته‌ای است که بالا می‌آید. */
  moods: [
    { from: 5,  to: 11, text: "صبح بخیر! وقت صبحانه‌ست", cat: "breakfast" },
    { from: 11, to: 16, text: "ظهر بخیر! ناهار پناه آماده‌ست", cat: "meal" },
    { from: 16, to: 19, text: "عصر بخیر! وقت چای و شیرینیه", cat: "tea" },
    { from: 19, to: 24, text: "شب بخیر! با یه نوشیدنی گرم، شب گرم‌تر می‌شه", cat: "hot" },
    { from: 0,  to: 5,  text: "شب‌زنده‌دار! یه چای داغ بد نیست", cat: "tea" }
  ],
  instagram: "panah_kitchen",
  phone: "",     // اگر پر شود در پایین صفحه نمایش داده می‌شود
  LOGO_SRC: ""   // خالی = لوگوی داخل فایل (انتهای صفحه). برای لوگوی دیگر آدرس فایل را بنویسید، مثلاً "logo.png"
};

/* نشریه‌ی ماه: هر ماه متن‌ها را عوض کنید. بخش خالی نمایش داده نمی‌شود. */
const MONTHLY = {
  title: "نشریه‌ی ماه پناه",
  news: [

const $ = s => document.querySelector(s);
const FA = "۰۱۲۳۴۵۶۷۸۹";
const fa = n => String(n).replace(/\d/g, d => FA[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase()
  .replace(/[يى]/g, "ی").replace(/ك/g, "ک").replace(/[\u064B-\u0652]/g, "")
  .replace(/[\u200c\s]+/g, "")
  .replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));

/* پرده‌ی ورودی: خودکار بعد از حدود ۴ ثانیه بسته می‌شود (در CSS)، با لمس زودتر */

/* کارت اطلاعات و وضعیت باز/بسته (به وقت تهران) */
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const hm = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fmt = t => { const [h, m] = t.split(":").map(Number); return fa(h) + ":" + fa(String(m).padStart(2, "0")); };
const entryFor = d => SETTINGS.schedule.find(e => e.on.includes(d));
function nowTehran() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tehran", weekday: "short", hour: "numeric", minute: "numeric", hourCycle: "h23" }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return { d: p.weekday, t: (+p.hour) * 60 + (+p.minute) };
}
function status() {
  const { d, t } = nowTehran(), e = entryFor(d);
  if (e && t >= hm(e.open) && t < hm(e.close)) return { open: true, text: `اکنون باز است؛ تا ${fmt(e.close)}` };
  if (e && t < hm(e.open)) return { open: false, text: `اکنون بسته است؛ امروز ${fmt(e.open)} باز می‌شود` };
  const n = entryFor(DAYS[(DAYS.indexOf(d) + 1) % 7]);
  return { open: false, text: n ? `اکنون بسته است؛ فردا ${fmt(n.open)} باز می‌شود` : "اکنون بسته است" };
}
function renderInfo() {
  let s = null, today = "";
  try { s = status(); today = nowTehran().d; } catch (e) {}
  const rows = SETTINGS.schedule.map(e => `<li${e.on.includes(today) ? ' class="today"' : ""}><span>${esc(e.days)}</span><b>${fmt(e.open)} تا ${fmt(e.close)}</b></li>`).join("");
  const map = SETTINGS.mapUrl || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(SETTINGS.mapQuery);
  $("#info").innerHTML =
    (s ? `<div class="st ${s.open ? "on" : "off"}"><i></i>${esc(s.text)}</div>` : "") +
    `<div class="ad"><svg class="ic"><use href="#i-pin"/></svg><span>${esc(SETTINGS.address)}</span></div><ul class="hr">${rows}</ul>` +
    `<div class="btns"><a class="btn p" href="${esc(map)}" target="_blank" rel="noopener">مسیریابی</a>` +
    (SETTINGS.instagram ? `<a class="btn" href="https://instagram.com/${esc(SETTINGS.instagram)}" target="_blank" rel="noopener">اینستاگرام</a>` : "") + `</div>`;
}

/* جستجو */
const q = $("#q");
function filter() {
  const k = norm(q.value);
  $("#qx").hidden = !q.value;
  let any = false;
  document.querySelectorAll(".cat").forEach(sec => {
    let n = 0;
    sec.querySelectorAll(".it").forEach(li => {
      const show = !k || li.dataset.k.includes(k);
      li.style.display = show ? "" : "none";
      if (show) n++;
    });
    sec.style.display = n ? "" : "none";
    if (n) any = true;
  });
  $("#sheet").style.display = any ? "" : "none";
  $("#empty").style.display = any ? "none" : "block";
}
q.addEventListener("input", filter);
$("#qx").addEventListener("click", () => { q.value = ""; filter(); q.focus(); });

    const b = e.target.closest(".sg"); if (!b) return;
    if (q.value) { q.value = ""; filter(); }
    const li = document.querySelector('.it[data-k="' + b.dataset.k + '"]'); if (!li) return;

  });
}

/* چیپ‌ها و اسکرول */
const chips = [...document.querySelectorAll(".chip")];
function movePill(b) {
  const p = $("#pill"); if (!b || !p) return;
  p.style.width = b.offsetWidth + "px"; p.style.height = b.offsetHeight + "px";
  p.style.transform = `translate(${b.offsetLeft}px,${b.offsetTop}px)`;
}
function setOn(t) {
  chips.forEach(b => {
    const on = b.dataset.t === t;
    b.classList.toggle("on", on);
    if (on) { b.scrollIntoView({ inline: "center", block: "nearest" }); movePill(b); }
  });
}
const curChip = () => chips.find(b => b.classList.contains("on"));
movePill(curChip());
if (document.fonts) document.fonts.ready.then(() => movePill(curChip()));
addEventListener("resize", () => movePill(curChip()));

/* توقف انیمیشن‌های بی‌نهایت وقتی بخش از صفحه بیرون است (صرفه‌جویی باتری) */
if ("IntersectionObserver" in window) {
  document.documentElement.classList.add("io");
  const vis = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("live", e.isIntersecting)));
  document.querySelectorAll(".cat,.hero,#gz,#picks").forEach(el => vis.observe(el));
}

/* ظاهر شدن آرام آیتم‌ها هنگام اسکرول */
if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion:reduce)").matches) {
  document.documentElement.classList.add("rv");
  const ro = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); ro.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
  document.querySelectorAll(".it").forEach((li, i) => { li.style.transitionDelay = (i % 5) * 50 + "ms"; ro.observe(li); });
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  if (q.value) { q.value = ""; filter(); }
  const t = b.dataset.t;
  setOn(t);
  (t ? document.getElementById(t) : $("#menu")).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" });
});
const io = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting && !q.value) setOn(e.target.id); });
}, { rootMargin: "-25% 0px -65% 0px" });
document.querySelectorAll(".cat").forEach(s => io.observe(s));
